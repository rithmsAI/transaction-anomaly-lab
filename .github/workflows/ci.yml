name: Verify experiment and service
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-api.txt
      - run: python -m unittest discover -s tests -v
      - run: python lab.py --output /tmp/anomaly-smoke
      - run: python evaluate_shift.py --seeds 101 202 --output /tmp/shift-smoke.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise container
        shell: bash
        run: |
          docker build -t anomaly-lab .
          export LAB_API_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          docker run -d --name anomaly-smoke -p 127.0.0.1:8000:8000 -e LAB_API_KEY anomaly-lab
          trap 'docker logs anomaly-smoke; docker rm -f anomaly-smoke' EXIT
          python3 scripts/smoke_api.py
